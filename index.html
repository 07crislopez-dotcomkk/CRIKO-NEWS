settings(){modal(`<h2>${b('Ajustes','Settings')}</h2><label>${b('Idioma','Language')}</label>${sel(['es','en'],S.lang,'lang',['Español','English'])}<label>${b('Tamaño de letra','Text size')}</label>${sel([.9,1,1.15,1.3],S.size,'size',['S','M','L','XL'])}<label>${b('Sonido','Sound')}</label>${sel([1,0],S.sound,'sound',[b('Sí','Yes'),'No'])}<label>${b('Alertas de tu lista (±2%)','Watchlist alerts (±2%)')}</label>${sel([1,0],S.alerts,'alerts',[b('Sí','Yes'),'No'])}<p><button class="b" data-a="exp">${b('Copiar mi lista','Copy my list')}</button> <button class="b" data-a="imp">${b('Importar lista','Import list')}</button></p><p id="bs" class="mu"></p>`);dj('status.json').then(x=>{const e=$('#bs');if(e)e.textContent='Bot: '+x.quotes+' '+b('precios','prices')+' · '+(x.candles||0)+' '+b('velas','candles')+' · '+(x.analysis||0)+' '+b('análisis','analyses')+' · '+ago(x.updated)}).catch(()=>{const e=$('#bs');if(e)e.textContent=b('El bot todavía no ha guardado datos.','The bot has not saved data yet.')})},
lang(d){S.lang=d.v;save();render();A.settings()},theme(d){S.theme=+d.v;save();render();A.settings()},size(d){S.size=+d.v;save();render();A.settings()},sound(d){S.sound=+d.v;save();A.settings();beep(700)},alerts(d){S.alerts=+d.v;save();A.settings()},
exp(){const c=JSON.stringify({f:S.favs});navigator.clipboard&&navigator.clipboard.writeText(c);modal(`<p class="mu" style="word-break:break-all">${esc(c)}</p>`)},
imp(){modal(`<input id="ic" placeholder='{"f":[...]}'><button class="b on" data-a="doimp">OK</button>`)},
doimp(){try{S.favs=JSON.parse($('#ic').value).f||[];save();A.close();render();jingle(1)}catch(e){toast(b('Código no válido','Invalid code'))}},
calc,auto,
crange(d){CRN=+d.v;drawChart(STK)},
evalsim(d){STK=d.id;A.close();tab='sim';render();scrollTo(0,0)},
async sellcur(){const t=resolve($('#a_tk').value),o=S.sim.pos[t];if(!o){toast(b('No tienes esa acción.','You do not own that.'));return}
 let p=SIM&&SIM.tk===t?SIM.p:null;try{if(p==null)p=await getPx(t)}catch(e){toast(b('No se pudo vender ahora.','Could not sell now.'));return}
 const take=Math.min(+$('#sa').value||0,o.q*p),qs=take/p;if(!(take>0))return;S.sim.cash+=take;jingle(take/o.q/p*o.q>=0&&p*o.q>=o.c);o.c*=1-qs/o.q;o.q-=qs;if(o.q<1e-6)delete S.sim.pos[t];save();render()},
amt(d){const e=$('#sa');e.value=Math.max(0,(+e.value||0)+ +d.v);beep(500)},
spd(d){SPD=+d.v;beep(600);simTimer();render()},
lesson,
pick(d){const e=$('#a_tk');e.value=d.id;const g=$('#sgl');if(g)g.innerHTML='';A.auto()},
lgo(){LS.res=null;LS.st++;lrender()},
lpick(d){const q=LS.qs[LS.st];if(LS.res!=null)return;LS.res=+d.v===q.k;if(LS.res){LS.ok++;jingle(1)}else beep(250,.25);lrender()},
lend(){A.close();render()},
chat(){modal(chatHTML());const c=$('#cl');if(c)c.scrollTop=c.scrollHeight},
async chart(d){const k=d.id,n=+d.r||63;modal(`<h2>${esc(d.n||k)}</h2><div class="chips">${[[21,'1M'],[63,'3M'],[126,'6M'],[252,'1Y']].map(x=>`<button class="b ${x[0]===n?'on':''}" data-a="chart" data-id="${esc(k)}" data-n="${esc(d.n||k)}" data-r="${x[0]}">${x[1]}</button>`).join('')}</div><div id="cv" class="mu">${b('Cargando…','Loading…')}</div><p><button class="b on" data-a="evalsim" data-id="${esc(k)}">${b('Evaluar y simular','Evaluate and simulate')}</button></p>`);
 try{$('#cv').innerHTML=svgCandles(await candles(k),n)+`<small class="mu">${b('Verde sube, rojo baja. La línea es el promedio de 20 días.','Green up, red down. The line is the 20-day average.')}</small>`}catch(e){$('#cv').textContent=b('Aún no hay velas. Se llenan cuando corre el bot en GitHub.','No candles yet. They fill in when the GitHub bot runs.')}},
ask(){const i=$('#cq');if(!i||!i.value.trim())return;const q=i.value.trim();const t0=tab;CH.push(['me',esc(q)]);CH.push(['bot',reply(q)]);beep(660);if(tab===t0)A.chat()},
askq(d){const t0=tab;CH.push(['me',esc(d.v)]);CH.push(['bot',reply(d.v)]);beep(660);if(tab===t0)A.chat()},
async buy(){const tk=resolve($('#a_tk').value),amt=+$('#sa').value;if(!tk||!(amt>0))return;if(amt>S.sim.cash){toast(b('No te alcanza el efectivo.','Not enough cash.'));return}
 let p=SIM&&SIM.tk===tk?SIM.p:null;try{if(p==null)p=await getPx(tk)}catch(e){toast(b('No encontré ese símbolo.','Ticker not found.'));return}
 const o=S.sim.pos[tk]||{q:0,c:0};S.sim.pos[tk]={q:o.q+amt/p,c:o.c+amt};S.sim.cash-=amt;save();jingle(1);render()},
async sell(d){const o=S.sim.pos[d.id];try{const p=await getPx(d.id);S.sim.cash+=o.q*p;jingle(o.q*p>=o.c);delete S.sim.pos[d.id];save();render()}catch(e){toast(b('No se pudo vender ahora.','Could not sell now.'))}},
simreset(){S.sim={cash:10000,pos:{}};save();beep(400);render()},
async tm(){const tk=resolve($('#tt').value),amt=+$('#ta').value,y=+$('#ty').value;
 try{const c=DEMO?(await candles(tk)).c:(await yj('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(tk)+'?interval=1mo&range='+y+'y')).chart.result[0].indicators.quote[0].close.filter(x=>x!=null);let pk=c[0],dd=0;c.forEach(x=>{pk=Math.max(pk,x);dd=Math.min(dd,x/pk-1)});const v=amt*c[c.length-1]/c[0],r=(v/amt-1)*100;
  $('#to').innerHTML=`${b('Si hubieras puesto','If you had put')} $${amt.toLocaleString('en-US')} ${b('en','in')} ${esc(tk)} ${b(`hace ${y} años`,`${y} years ago`)}, ${b('hoy tendrías','today you would have')} <b>$${v.toFixed(0)}</b> (${r>=0?'+':''}${r.toFixed(0)}%). ${b('Lo peor que bajó en el camino','The worst drop along the way')}: ${(dd*100).toFixed(0)}%.`;jingle(v>=amt)}catch(e){$('#to').textContent=b('No pude cargar ese símbolo.','Could not load that ticker.')}},
ci(){const[a,m,r,y]=['c1','c2','c3','c4'].map(i=>+$('#'+i).value),i=r/1200;let v=a;for(let k=0;k<y*12;k++)v=v*(1+i)+m;$('#co').textContent='$'+v.toLocaleString('en-US',{maximumFractionDigits:0});jingle(1)},
quiz(){const i=Math.random()*G.length|0,o=new Set([i]);while(o.size<3)o.add(Math.random()*G.length|0);const op=[...o].sort(()=>Math.random()-.5);modal(`<h2>${b('¿Qué concepto es?','Which concept is it?')}</h2><p>${G[i][2+lg()]}</p>`+op.map(k=>`<p><button class="b" style="width:100%" data-a="ans" data-v="${k}" data-i="${i}">${G[k][lg()]}</button></p>`).join(''))},
ans(d){const ok=d.v===d.i;ok?jingle(1):jingle(0);modal(`<h2>${ok?b('Correcto','Correct'):b('Era: ','It was: ')+G[d.i][lg()]}</h2><p>${G[d.i][2+lg()]}</p><button class="b on" data-a="quiz">${b('Siguiente','Next')}</button>`)}
};
document.addEventListener('click',e=>{const x=e.target.closest('[data-a]');if(x)A[x.dataset.a](x.dataset);else if(e.target.id==='m')A.close()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cq')A.ask()});
(function(){const d=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();if(S.last!==d){S.streak=S.last===y?S.streak+1:1;S.last=d;save()}})();
render();
const tick=async f=>{await Promise.all([loadQ(),loadNews(f).catch(()=>0)]);if(['hoy','mk'].includes(tab)&&!document.activeElement.matches('input'))render()};
tick();
setInterval(()=>{if(!document.hidden)tick()},60000);
</script>
